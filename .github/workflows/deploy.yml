name: Build and Deploy XAUUSD Intelligence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test domain logic
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Verify Hugging Face token
        id: huggingface
        run: node scripts/check-huggingface.mjs >> "$GITHUB_OUTPUT"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Build static site
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          DEPLOYMENT_STATUS: READY
          HF_PROVIDER_STATUS: ${{ steps.huggingface.outputs.status }}
          ASSET_VERSION: ${{ github.sha }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
